[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = qio
board_build.f_cpu = 240000000L
build_flags =
    -O3
    -DNDEBUG
    -Ilib/tflite_micro/src
    -Ilib/tflite_micro/src/tensorflow/lite/micro
    -Ilib/tflite_micro/src/tensorflow/lite/schema
    -Ilib/tflite_micro/src/tensorflow/lite/core/api
